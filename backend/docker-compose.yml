services:
  139yun-music-backend:
    image: q1515/139yun-music-backend:0.1
    container_name: 139yun-music-backend
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
